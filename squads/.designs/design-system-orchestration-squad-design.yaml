squad:
  name: design-system-orchestration
  description: "Squad focado na arquitetura, governança e implementação de Design Systems modulares, integrando DesignOps e IA Generativa conforme os playbooks de Frost, Mall, Malouf e Nano Banana."
  domain: Design System & Product Design

analysis:
  entities:
    - Design Tokens
    - Atoms/Molecules/Organisms
    - UI Components
    - Semantic Tokens
    - Heuristics
    - Generative AI Prompts
    - Seeds (Visual Consistency)
  workflows:
    - subatomic-foundation-setup
    - modular-component-evolution
    - semantic-token-governance
    - accessibility-math-audit
    - component-api-abstraction
    - stratified-visual-generation
  integrations:
    - Figma/Tokens Studio
    - Tailwind CSS
    - CI/CD Pipelines
    - Generative AI Models (Visual)

recommendations:
  agents:
    - id: atomic-architect
      role: "Especialista em arquitetura modular e fundações subatômicas (Atoms, Molecules, Organisms)."
      commands: ["*define-subatomic-foundations", "*map-atom-states", "*build-modular-hierarchy"]
      confidence: 0.95
    - id: design-strategist
      role: "Gestor de governança, nomenclatura semântica e adoção do sistema através da regra de três."
      commands: ["*implement-semantic-naming", "*apply-adoption-rule-of-three", "*orchestrate-pilot-tests"]
      confidence: 0.92
    - id: ux-expert
      role: "Guardião da experiência do usuário, psicologia cognitiva e taxonomia de dados."
      commands: ["*apply-cognitive-laws", "*conduct-heuristic-audit", "*map-information-taxonomy"]
      confidence: 0.90
    - id: ui-stylist
      role: "Especialista em micro-estética, grids de 8pt, acessibilidade matemática e cinestesia."
      commands: ["*enforce-8pt-grid", "*design-responsive-behaviors", "*audit-math-accessibility", "*define-kinetic-motion"]
      confidence: 0.94
    - id: bridge-engineer
      role: "Arquiteto de software focado em APIs de componentes, slots e automação de tokens no CI/CD."
      commands: ["*architect-component-api", "*setup-token-ci-pipeline", "*optimize-tailwind-implementation"]
      confidence: 0.93
    - id: visual-generator
      role: "Especialista em ativos visuais generativos usando prompts estratificados e seeds de consistência."
      commands: ["*create-stratified-prompts", "*lock-visual-consistency", "*apply-tactile-texturing"]
      confidence: 0.88

  tasks:
    - name: define-subatomic-foundations
      agent: atomic-architect
      entrada: ["base_scales", "color_palette", "grid_specs"]
      saida: ["design_tokens_json", "foundation_specs"]
    - name: map-atom-states
      agent: atomic-architect
      entrada: ["atom_definition", "interactive_context"]
      saida: ["state_matrix", "interaction_docs"]
    - name: implement-semantic-naming
      agent: design-strategist
      entrada: ["primitive_tokens", "usage_intent"]
      saida: ["semantic_token_map", "naming_convention"]
    - name: conduct-heuristic-audit
      agent: ux-expert
      entrada: ["ui_flows", "nielsen_heuristics"]
      saida: ["audit_report", "friction_points"]
    - name: audit-math-accessibility
      agent: ui-stylist
      entrada: ["component_colors", "font_sizes"]
      saida: ["wcag_report", "contrast_ratios"]
    - name: setup-token-ci-pipeline
      agent: bridge-engineer
      entrada: ["token_files", "accessibility_rules"]
      saida: ["validation_pipeline_config", "status_checks"]
    - name: create-stratified-prompts
      agent: visual-generator
      entrada: ["visual_identity", "action_context"]
      saida: ["4_layer_prompt", "seed_values"]

metadata:
  created_at: "2026-03-14T12:45:00Z"
